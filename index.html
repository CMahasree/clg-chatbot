<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Information Bot</title>
<style>
  :root {
    color-scheme: light;
    --bg: #eceff6; --panel: #ffffff; --ink: #1b2233; --muted: #667089;
    --line: #d5daea; --accent: #3a4bc7; --accent-ink: #ffffff; --bot: #f3f5fb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #12151f; --panel: #1a1f2e; --ink: #e7eaf5; --muted: #96a0ba;
      --line: #2b3247; --accent: #8c9bff; --accent-ink: #11162a; --bot: #232a3d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column;
    background: var(--panel); border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  header h1 { font: 700 1.2rem/1.2 Georgia, "Iowan Old Style", serif; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  header .grow { flex: 1; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); padding: 6px 12px; font-size: .88rem;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
  .chips button { border-radius: 999px; border-color: var(--accent); color: var(--accent); background: transparent; }
  .chips button:hover { background: var(--accent); color: var(--accent-ink); }
  form { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
  input {
    flex: 1; font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px;
  }
  form button { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 0 20px; }
  form button:disabled { opacity: .45; cursor: default; }
  .typing { color: var(--muted); font-style: italic; }
  @media (max-width: 720px) { .app { border: 0; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="grow">
      <h1 id="collegeName">College Information Bot</h1>
      <p>Ask about admissions, fees, programs, housing and more.</p>
    </div>
    <button type="button" id="clear">Clear chat</button>
  </header>

  <main id="log" aria-live="polite"></main>
  <div class="chips" id="chips"></div>

  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Type your question…" aria-label="Your question">
    <button type="submit" id="send" disabled>Send</button>
  </form>
</div>

<script>
/* =========================================================================
   EDIT HERE: college information (all values are fictional placeholders).
   - "name":     shown in the page header and greeting
   - "keywords": words or phrases that trigger the topic
   - "answer":   the text shown to the student (\n starts a new line)
   To add a topic, copy a block, give it a new key, and fill it in.
   Replace every placeholder with your college's real details.
   ========================================================================= */
const COLLEGE = {
  name: "Riverside Valley College",
  topics: {
    admissions: {
      keywords: ["admission", "admit", "apply", "application", "requirement", "eligibility", "marks", "cutoff", "entrance", "how to apply"],
      answer: "Admission requirements:\n  - Completed online application and ₹500 fee\n  - 12th-grade marksheet (minimum 60% recommended)\n  - Entrance exam score is optional\n  - One recommendation letter and a short personal statement"
    },
    tuition: {
      keywords: ["tuition", "fee", "cost", "price", "expensive", "how much", "afford", "charge", "payment", "pay", "installment", "refund", "semester fee", "course fee", "tuition fee", "fee structure", "fee detail", "rupee"],
      answer: "Fee details (per academic year):\nTuition by program:\n  - B.Tech (Computer Science / IT): ₹1,85,000\n  - BBA: ₹1,20,000\n  - B.Sc Nursing: ₹1,40,000\n  - B.Des (Graphic Design): ₹1,60,000\nOther charges (all programs):\n  - Student/activity fees: ₹12,000\n  - Exam fees: ₹6,000\n  - Books and supplies (estimate): ₹9,000\nHostel (optional): room ₹90,000 + mess ₹48,000\nTransport (optional): ₹18,000 to ₹36,000 by distance\nPayment: two installments (June 15 and December 15).\nRefunds: full refund of tuition before July 1; none after.\nScholarships and financial aid: see the Financial Aid Office."
    },
    programs: {
      keywords: ["major", "program", "course", "degree", "study", "department", "subject", "offer", "computer science", "business", "nursing", "branch"],
      answer: "Popular programs:\n  - Computer Science (B.Tech)\n  - Information Technology (B.Tech)\n  - Business Administration (BBA)\n  - Nursing (B.Sc)\n  - Graphic Design (B.Des)"
    },
    location: {
      keywords: ["location", "located", "where", "address", "campus", "directions", "city", "map", "find you"],
      answer: "Riverside Valley College is located at 123 College Avenue, Springfield, ST 12345. The main campus is 10 minutes from downtown and is served by city bus routes 4 and 12."
    },
    deadlines: {
      keywords: ["deadline", "due", "date", "when", "early decision", "regular decision", "last day"],
      answer: "Key application deadlines:\n  - Early round: November 15\n  - Regular round: February 1\n  - Scholarship applications: March 1\n  - Seat confirmation fee: May 1"
    },
    housing: {
      keywords: ["housing", "hostel", "dorm", "residence", "live", "room", "accommodation", "on-campus", "off-campus", "roommate", "hostel fee", "room rent", "mess fee"],
      answer: "Housing:\n  - First-year students live in on-campus hostels\n  - Single and double rooms; about ₹90,000 per year\n  - Mess meal plans are available\n  - Apply for a hostel room by June 1 through the student portal"
    },
    contact: {
      keywords: ["contact", "phone", "email", "call", "reach", "office", "talk to", "speak", "email address", "phone number", "contact number"],
      answer: "Contact the Admissions Office:\n  - Phone: (555) 010-1234\n  - Email: admissions@riversidevalley.example\n  - Website: www.riversidevalley.example\n  - Hours: Mon-Fri, 9:00 AM - 5:00 PM"
    },
    transport: {
      keywords: ["transport", "bus", "van", "shuttle", "pickup", "drop", "route", "vehicle", "parking", "bike", "travel", "commute", "bus fee", "bus pass", "college bus", "two-wheeler", "how to reach", "reach college", "get to college", "by bus"],
      answer: "Transport facilities:\n  - College buses run on 12 routes across the city and nearby towns\n  - Pickup: 7:00-8:30 AM | Drop: 4:30-6:00 PM\nBus fee per year (by distance from campus):\n  - Up to 10 km: ₹18,000\n  - 10 to 20 km: ₹24,000\n  - 20 to 30 km: ₹30,000\n  - Above 30 km: ₹36,000\n  - Occasional use (per trip): ₹80\n  - Pay in two installments along with tuition (June 15 and December 15)\nParking on campus:\n  - Two-wheeler permit: ₹1,000 per year\n  - Four-wheeler permit: ₹3,000 per year\nPublic buses 4 and 12 also stop at the campus gate (fare about ₹20).\nTransport office: (555) 010-5678, transport@riversidevalley.example"
    },
    facilities: {
      keywords: ["facility", "library", "lab", "wifi", "internet", "canteen", "cafeteria", "food", "gym", "medical", "hospital", "atm", "amenity", "infrastructure", "computer lab"],
      answer: "Campus facilities:\n  - Library: 50,000+ books and e-journals, open 8:00 AM - 8:00 PM\n  - Labs: computer, electronics and design labs with modern equipment\n  - Wi-Fi across the whole campus, free for students\n  - Canteen: meals from ₹60 to ₹120\n  - Gym, playground, cricket and basketball courts\n  - Medical room with a visiting doctor on weekdays\n  - ATM and stationery shop on campus"
    },
    placements: {
      keywords: ["placement", "job", "recruiter", "package", "salary", "internship", "career", "company", "hiring", "lpa", "campus drive"],
      answer: "Placements and internships:\n  - About 85% of eligible students placed last year\n  - Highest package: ₹12 LPA | Average package: ₹4.5 LPA\n  - 60+ recruiters visit every year (IT, finance, core engineering)\n  - Internships in the 3rd year; training starts from the 2nd year\n  - Resume workshops, mock interviews and aptitude training\n  - Placement cell: placements@riversidevalley.example"
    },
    scholarships: {
      keywords: ["scholarship", "financial aid", "merit", "concession", "waiver", "grant", "bursary", "discount", "free seat"],
      answer: "Scholarships and financial aid:\n  - Merit: 50% tuition waiver for 95%+ in 12th grade; 25% for 90-95%\n  - Government scholarships available as per state rules\n  - Sports and cultural achievement concessions\n  - Education loan help through partner banks\n  - Apply by March 1 at the Financial Aid Office"
    },
    activities: {
      keywords: ["club", "event", "fest", "sport", "activity", "extracurricular", "cultural", "symposium", "nss", "hackathon", "student life"],
      answer: "Student life:\n  - Clubs: Coding, Robotics, Music, Drama, Photography, Entrepreneurship\n  - Annual cultural fest in February; tech symposium in September\n  - Hackathons and workshops every semester\n  - NSS and community service programs\n  - Inter-college sports meet every December"
    },
    about: {
      keywords: ["about us", "about the college", "about college", "history", "established", "accredit", "naac", "nirf", "ranking", "affiliation", "overview", "aicte"],
      answer: "About Riverside Valley College:\n  - Established in 1998, affiliated to Springfield State University\n  - Approved by AICTE; NAAC 'A' grade accredited\n  - 4,500 students and 250 faculty members on a 30-acre campus\n  - Strong focus on practical learning, projects and industry training"
    }
  }
};
/* ====================== END OF EDITABLE DATA ============================ */

const EXIT_WORDS = ["quit", "exit", "bye", "q"];
const GREETINGS = ["hi", "hello", "hey", "hiya"];
const FALLBACK = 'Sorry, I don\'t have information on that. Type "help" to see the topics I can answer.';

/** Lightly strip plurals so "fees" matches "fee". */
function stem(w) { return (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) ? w.slice(0, -1) : w; }

/** Lowercase text and return simplified word tokens. */
function tokenize(text) { return (text.toLowerCase().match(/[a-z0-9\-]+/g) || []).map(stem); }

/** Levenshtein distance between two short words. */
function editDistance(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++)
      cur.push(Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] !== b[j - 1] ? 1 : 0)));
    prev = cur;
  }
  return prev[b.length];
}

/** Exact match, or within 1 typo for keywords of 5+ letters. */
function wordMatches(kw, set) {
  if (set.has(kw)) return true;
  if (kw.length < 5) return false;
  for (const t of set) if (Math.abs(t.length - kw.length) <= 1 && editDistance(t, kw) <= 1) return true;
  return false;
}

/** +1 per matching keyword, +2 per matching multi-word phrase. */
function scoreTopic(tokens, topic) {
  const joined = " " + tokens.join(" ") + " ";
  const set = new Set(tokens);
  let score = 0;
  for (const kw of topic.keywords) {
    const k = tokenize(kw);
    if (k.length > 1) { if (joined.includes(" " + k.join(" ") + " ")) score += 2; }
    else if (k.length && wordMatches(k[0], set)) score += 1;
  }
  return score;
}

/** Return the key of the best-matching topic, or null. */
function findBestTopic(question) {
  const tokens = tokenize(question);
  let bestKey = null, best = 0;
  for (const [key, topic] of Object.entries(COLLEGE.topics)) {
    const s = scoreTopic(tokens, topic);
    if (s > best) { best = s; bestKey = key; }
  }
  return bestKey;
}

/** Return the bot's reply text for one question. */
function getAnswer(question) {
  const q = question.trim();
  if (!q) return 'Please type a question, or "help" to see what I can answer.';
  const lowered = q.toLowerCase().replace(/^[!?. ]+|[!?. ]+$/g, "");
  if (EXIT_WORDS.includes(lowered)) return "Goodbye! Good luck with your college search. You can keep chatting any time.";
  if (GREETINGS.includes(lowered)) return `Hello! Ask me anything about ${COLLEGE.name}.`;
  if (lowered === "help") return "I can answer questions about: " + Object.keys(COLLEGE.topics).join(", ") + '.\nTry: "What are the admission requirements?" or "How much is tuition?"';
  const key = findBestTopic(q);
  return key ? COLLEGE.topics[key].answer : FALLBACK;
}

/* ---------------------------- page wiring ------------------------------ */
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send");

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;           // textContent keeps user input safe
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function ask(question) {
  const q = question.trim();
  if (!q) return;
  addMessage(q, "user");
  const wait = addMessage("Typing…", "bot");
  wait.classList.add("typing");
  setTimeout(() => {
    wait.classList.remove("typing");
    wait.textContent = getAnswer(q);
    log.scrollTop = log.scrollHeight;
  }, 350);
}

function greet() {
  log.innerHTML = "";
  addMessage(`Welcome to the ${COLLEGE.name} information bot! Pick a topic below or type your own question.`, "bot");
}

function buildChips() {
  const samples = {
    admissions: "What are the admission requirements?", tuition: "How much is tuition?",
    programs: "What programs do you offer?", location: "Where is the campus?",
    deadlines: "What are the deadlines?", housing: "Do you have hostels?", contact: "How can I contact you?",
    transport: "What are the transport facilities and bus fees?", facilities: "What facilities are on campus?",
    placements: "Tell me about placements", scholarships: "What scholarships are available?",
    activities: "What clubs and events are there?", about: "Tell me about the college"
  };
  $("chips").innerHTML = "";
  for (const key of Object.keys(COLLEGE.topics)) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = key.charAt(0).toUpperCase() + key.slice(1);
    b.addEventListener("click", () => ask(samples[key] || key));
    $("chips").appendChild(b);
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  ask(input.value);
  input.value = "";
  send.disabled = true;
  input.focus();
});
input.addEventListener("input", () => { send.disabled = !input.value.trim(); });
$("clear").addEventListener("click", greet);

$("collegeName").textContent = COLLEGE.name + " Bot";
document.title = COLLEGE.name + " Bot";
buildChips();
greet();
input.focus();
</script>
</body>
</html>
